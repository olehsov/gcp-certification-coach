# ACE learning path snapshot
#
# Purpose: starting data for the curated ACE pack (plugins/gcp-cert-coach/skills/init/assets/packs/ace/).
# Source: public course outlines of the Google Skills path "Associate Cloud Engineer Certification"
#         (https://www.skills.google/paths/11) and the identical Coursera specialization
#         "Preparing for Google Cloud Certification: Cloud Engineer".
# Collected: 2026-11-10. The builder MUST re-verify against the live pages before converting this
#            into the pack, fill in skill-badge modules, and confirm which activities are optional.
# Content rule: titles and structure only. Do not copy course descriptions or materials.
#
# sections: exam-guide objective ids (Associate Cloud Engineer exam guide, 5 sections).
# weight: core | support (support counts half in readiness).
# examRelevant: false for intro, summary, resources and study-tool modules.

examGuide:
  url: https://cloud.google.com/learn/certification/guides/cloud-engineer
  sections:
    - {id: "1", name: Setting up a cloud solution environment, weight: 20}
    - {id: "2", name: Planning and configuring a cloud solution, weight: 17.5}
    - {id: "3", name: Deploying and implementing a cloud solution, weight: 25}
    - {id: "4", name: Ensuring successful operation of a cloud solution, weight: 20}
    - {id: "5", name: Configuring access and security, weight: 17.5}

activities:
  - id: c1
    kind: course
    title: "Build a Certification Study Guide: ACE Exam Prep"
    hours: 2
    modules:
      - {id: c1-m1, title: NotebookLM and ACE Certification, examRelevant: false,
         concepts: [Learning objectives, About the certification]}
      - {id: c1-m2, title: Study guide preparation, examRelevant: false,
         concepts: [Sources, Prompting the notebook, Study modes, Recap]}

  - id: c2
    kind: course
    title: "Google Cloud Fundamentals: Core Infrastructure"
    hours: 8
    modules:
      - {id: c2-m1, title: Introducing Google Cloud, sections: ["1.2"], weight: support, examRelevant: true,
         concepts: [Cloud computing overview, IaaS and PaaS, The Google Cloud network, Environmental impact, Security, Open source ecosystems, Pricing and billing]}
      - {id: c2-m2, title: Resources and Access in the Cloud, sections: ["1.1", "5.1", "5.2"], weight: core, examRelevant: true,
         concepts: [Resource hierarchy, Identity and Access Management, Service accounts, Cloud Identity, Interacting with Google Cloud, Cloud Marketplace]}
      - {id: c2-m3, title: Virtual Machines and Networks in the Cloud, sections: ["2.1", "2.3", "3.1", "3.5"], weight: core, examRelevant: true,
         concepts: [VPC networking, Compute Engine, Scaling virtual machines, Important VPC compatibilities, Cloud Load Balancing, Cloud DNS and Cloud CDN, Connecting networks to Google VPC]}
      - {id: c2-m4, title: Storage in the Cloud, sections: ["2.2", "4.4"], weight: core, examRelevant: true,
         concepts: [Storage options overview, Cloud Storage, Storage classes and data transfer, Cloud SQL, Spanner, Firestore, Bigtable, Comparing storage options]}
      - {id: c2-m5, title: Containers in the Cloud, sections: ["2.1", "3.2"], weight: core, examRelevant: true,
         concepts: [Introduction to containers, Kubernetes, Google Kubernetes Engine]}
      - {id: c2-m6, title: Applications in the Cloud, sections: ["3.3", "4.3"], weight: core, examRelevant: true,
         concepts: [Cloud Run, Development in the cloud]}
      - {id: c2-m7, title: Prompt Engineering, examRelevant: false, concepts: [Prompt engineering]}
      - {id: c2-m8, title: Course Summary, examRelevant: false, concepts: [Course summary]}

  - id: c3
    kind: course
    title: "Essential Google Cloud Infrastructure: Foundation"
    hours: 8
    modules:
      - {id: c3-m1, title: Introduction, examRelevant: false, concepts: [Course introduction]}
      - {id: c3-m2, title: Interacting with Google Cloud, sections: ["1.1"], weight: core, examRelevant: true,
         concepts: [Console and Cloud Shell, Projects, Cloud Marketplace deployments]}
      - {id: c3-m3, title: Virtual Networks, sections: ["2.3", "3.5", "4.5"], weight: core, examRelevant: true,
         concepts: [Projects networks and subnetworks, Expanding a subnet, Internal and external IP addresses, Mapping IP addresses, Routes and firewall rules, Network pricing, Common network designs, Private Google Access and Cloud NAT]}
      - {id: c3-m4, title: Virtual Machines, sections: ["2.1", "3.1", "4.1"], weight: core, examRelevant: true,
         concepts: [Compute Engine, VM access and lifecycle, Compute options, Compute pricing, Special compute configurations, Images, Disk options, Common Compute Engine actions]}

  - id: c4
    kind: course
    title: "Essential Google Cloud Infrastructure: Core Services"
    hours: 11
    modules:
      - {id: c4-m1, title: Introduction, examRelevant: false, concepts: [Course introduction]}
      - {id: c4-m2, title: Identity and Access Management (IAM), sections: ["1.1", "5.1", "5.2"], weight: core, examRelevant: true,
         concepts: [Organization, Roles, Custom roles, Members, Service accounts, Organization restrictions, IAM best practices]}
      - {id: c4-m3, title: Storage and Database Services, sections: ["2.2", "3.4", "4.4"], weight: core, examRelevant: true,
         concepts: [Cloud Storage, Cloud Storage features, Choosing a storage class, Filestore, Cloud SQL, Spanner, AlloyDB, Firestore, Bigtable, Memorystore]}
      - {id: c4-m4, title: Resource Management, sections: ["1.1", "1.2"], weight: core, examRelevant: true,
         concepts: [Resource Manager, Quotas, Labels, Billing]}
      - {id: c4-m5, title: Resource Monitoring, sections: ["4.6"], weight: core, examRelevant: true,
         concepts: [Observability overview, Monitoring, Logging, Error Reporting, Tracing, Profiling, Partner integrations]}
      - {id: c4-m6, title: Course Resources, examRelevant: false, concepts: [Course resources]}

  - id: c5
    kind: course
    title: "Elastic Google Cloud Infrastructure: Scaling and Automation"
    hours: 7
    modules:
      - {id: c5-m1, title: Introduction, examRelevant: false, concepts: [Course introduction]}
      - {id: c5-m2, title: Interconnecting Networks, sections: ["3.5"], weight: core, examRelevant: true,
         concepts: [Cloud VPN and HA VPN, Cloud Interconnect, Peering, Choosing a connection, Shared VPC and VPC Network Peering]}
      - {id: c5-m3, title: Load Balancing and Autoscaling, sections: ["2.3", "3.1"], weight: core, examRelevant: true,
         concepts: [Managed instance groups, Autoscaling and health checks, Application Load Balancing, Cloud CDN, Network load balancing, Internal load balancing, Choosing a load balancer]}
      - {id: c5-m4, title: Infrastructure Automation, sections: ["3.6"], weight: core, examRelevant: true,
         concepts: [Terraform, Google Cloud Marketplace]}
      - {id: c5-m5, title: Managed Services, sections: ["3.4", "4.4"], weight: support, examRelevant: true,
         concepts: [BigQuery, Dataflow, Dataprep, Managed Service for Apache Spark]}

  - id: c6
    kind: course
    title: Getting Started with Google Kubernetes Engine
    hours: 6
    modules:
      - {id: c6-m1, title: Course Introduction, examRelevant: false, concepts: [Course introduction]}
      - {id: c6-m2, title: Introduction to Google Cloud, sections: ["1.1", "1.2"], weight: support, examRelevant: true,
         concepts: [Cloud computing and Google Cloud, Compute offerings, The Google network, Resource management, Billing, Interacting with Google Cloud]}
      - {id: c6-m3, title: Introduction to Containers and Kubernetes, sections: ["3.2"], weight: core, examRelevant: true,
         concepts: [Containers, Container images, Cloud Build, Kubernetes, Google Kubernetes Engine]}
      - {id: c6-m4, title: Kubernetes Architecture, sections: ["3.2", "4.2"], weight: core, examRelevant: true,
         concepts: [Kubernetes concepts, Kubernetes components, GKE Autopilot and GKE Standard, Object management]}
      - {id: c6-m5, title: Kubernetes Operations, sections: ["3.2", "4.2"], weight: core, examRelevant: true,
         concepts: [The kubectl command, Introspection]}
      - {id: c6-m6, title: Course Summary, examRelevant: false, concepts: [Course summary]}

  - id: c7
    kind: course
    title: Logging and Monitoring in Google Cloud
    hours: 14
    modules:
      - {id: c7-m1, title: Introduction to Google Cloud Observability, sections: ["4.6"], weight: support, examRelevant: true,
         concepts: [Need for observability, Cloud Monitoring, Cloud Logging, Error Reporting, Application performance management tools]}
      - {id: c7-m2, title: Monitoring Critical Systems, sections: ["4.6", "1.1"], weight: core, examRelevant: true,
         concepts: [Monitoring architecture patterns, Monitoring multiple projects, Data model and dashboards, Query metrics, Uptime checks]}
      - {id: c7-m3, title: Alerting Policies, sections: ["4.6"], weight: core, examRelevant: true,
         concepts: [SLI SLO and SLA, Developing an alerting strategy, Creating alerts, Service Monitoring]}
      - {id: c7-m4, title: Advanced Logging and Analysis, sections: ["4.6"], weight: core, examRelevant: true,
         concepts: [Cloud Logging architecture, Log types and collection, Storing routing and exporting logs, Querying and viewing logs, Log-based metrics, Log Analytics]}
      - {id: c7-m5, title: Working with Audit Logs, sections: ["4.6"], weight: core, examRelevant: true,
         concepts: [Cloud Audit Logs, Data Access audit logs, Audit log entry format, Audit logging best practices]}
      - {id: c7-m6, title: Course Summary, examRelevant: false, concepts: [Course summary]}
      - {id: c7-m7, title: Course Resources, examRelevant: false, concepts: [Course resources]}

  - id: c8
    kind: course
    title: Observability in Google Cloud
    hours: 11
    modules:
      - {id: c8-m1, title: Introduction, examRelevant: false, concepts: [Course introduction]}
      - {id: c8-m2, title: Configuring Google Cloud Services for Observability, sections: ["4.6"], weight: core, examRelevant: true,
         concepts: [Ops Agent, Non-VM resources, Cloud Operations for GKE, Managed Service for Prometheus, Exposing user-defined metrics]}
      - {id: c8-m3, title: Monitoring Google Cloud Network, sections: ["4.6"], weight: support, examRelevant: true,
         concepts: [VPC Flow Logs, Firewall Rules Logging, Load Balancer Logging, Cloud NAT logs, Packet Mirroring, Network Intelligence Center]}
      - {id: c8-m4, title: Investigating Application Performance Issues, sections: ["4.6"], weight: support, examRelevant: true,
         concepts: [Error Reporting, Cloud Trace, Cloud Profiler]}
      - {id: c8-m5, title: Optimizing the Costs for Google Cloud Observability, sections: ["4.6"], weight: support, examRelevant: true,
         concepts: [Observability costs and pricing, Bill estimation, Cost control best practices]}
      - {id: c8-m6, title: Course Summary, examRelevant: false, concepts: [Course summary]}

  - id: c9
    kind: course
    title: Getting Started with Terraform for Google Cloud
    hours: 6
    modules:
      - {id: c9-m1, title: Course Introduction, examRelevant: false, concepts: [Course introduction]}
      - {id: c9-m2, title: Introduction to Terraform for Google Cloud, sections: ["3.6"], weight: core, examRelevant: true,
         concepts: [Infrastructure as code, Terraform overview, Using Terraform]}
      - {id: c9-m3, title: Terms and Concepts, sections: ["3.6"], weight: core, examRelevant: true,
         concepts: [Terraform configurations and HCL, Author phase terms and concepts, Terraform commands, Terraform Validator]}
      - {id: c9-m4, title: Writing Infrastructure Code for Google Cloud, sections: ["3.6"], weight: core, examRelevant: true,
         concepts: [Resources, Meta-arguments, Resource dependencies, Variables, Variables best practices, Output values, Terraform Registry and Cloud Foundation Toolkit]}
      - {id: c9-m5, title: Organizing and Reusing Configuration with Terraform Modules, sections: ["3.6"], weight: core, examRelevant: true,
         concepts: [Terraform modules, Module use cases and benefits, Reusing configurations with modules, Module variables and outputs, Module best practices]}
      - {id: c9-m6, title: Introduction to Terraform State, sections: ["3.6"], weight: core, examRelevant: true,
         concepts: [Terraform state, Storing state files and remote backends, State best practices]}
      - {id: c9-m7, title: Course Summary, examRelevant: false, concepts: [Course summary]}

  # Skill badges: present in the Google Skills path, not in the Coursera specialization.
  # TODO(builder): read each badge page, list its labs as modules and the challenge lab,
  # map sections, confirm hours and whether the path marks them optional.
  - id: b1
    kind: skill_badge
    title: Implementing Cloud Load Balancing for Compute Engine
    sections: ["2.3", "3.1"]
  - id: b2
    kind: skill_badge
    title: Develop Your Google Cloud Network
    sections: ["3.5", "4.5"]
  - id: b3
    kind: skill_badge
    title: Build Infrastructure with Terraform on Google Cloud
    sections: ["3.6"]

# Exam-guide objectives that the path does not cover or covers only in passing.
# Shown only in Full exam mode as the "Exam guide gaps" activity.
# TODO(builder): verify each against the live exam guide and the path outlines,
# and attach 1–3 official documentation URLs per concept.
gaps:
  - {id: g01, title: Organization policies, sections: ["1.1"], concepts: [Organization Policy Service, Constraints and inheritance]}
  - {id: g02, title: Managing users and groups in Cloud Identity, sections: ["1.1"], concepts: [Manual user and group management, Automated provisioning and directory sync]}
  - {id: g03, title: Billing budgets, alerts and exports, sections: ["1.2"], concepts: [Budgets and alert thresholds, Billing export to BigQuery, Linking projects to billing accounts]}
  - {id: g04, title: Network Service Tiers, sections: ["2.3"], concepts: [Premium vs Standard tier]}
  - {id: g05, title: OS Login and VM Manager, sections: ["3.1"], concepts: [OS Login, VM Manager patch and inventory]}
  - {id: g06, title: GKE cluster configurations and operations, sections: ["3.2", "4.2"], concepts: [Regional and private clusters, Node pools, Horizontal and vertical Pod autoscaling, Artifact Registry access from GKE, StatefulSets and Services]}
  - {id: g07, title: Event-driven Cloud Run and Cloud Run functions, sections: ["3.3"], concepts: [Eventarc triggers, Pub/Sub and Cloud Storage events, Choosing Cloud Run vs Cloud Run functions]}
  - {id: g08, title: Cloud Run revisions, traffic splitting and scaling, sections: ["4.3"], concepts: [Revisions and traffic splitting, Min and max instances and concurrency]}
  - {id: g09, title: Loading data, sections: ["3.4"], concepts: [gcloud storage and bq command-line loading, Loading from Cloud Storage, Storage Transfer Service]}
  - {id: g10, title: Pub/Sub basics, sections: ["3.4"], concepts: [Topics and subscriptions, Push and pull delivery]}
  - {id: g11, title: Firewall policies and targeting, sections: ["3.5"], concepts: [Hierarchical and network firewall policies, Targeting by network tags and service accounts, Egress rules]}
  - {id: g12, title: Infrastructure as code tooling beyond Terraform, sections: ["3.6"], concepts: [Config Connector, Helm, Cloud Foundation Toolkit]}
  - {id: g13, title: Snapshot schedules and image management, sections: ["4.1"], concepts: [Snapshot schedules, Creating images from disks and snapshots]}
  - {id: g14, title: Cloud Storage lifecycle and object security, sections: ["4.4"], concepts: [Object Lifecycle Management, Uniform bucket-level access and signed URLs]}
  - {id: g15, title: Database backup, restore and cost estimation, sections: ["4.4"], concepts: [Cloud SQL backups and point-in-time recovery, Firestore backups, Estimating storage costs]}
  - {id: g16, title: Service account impersonation and short-lived credentials, sections: ["5.2"], concepts: [Service account impersonation, Short-lived credentials, Attaching service accounts to resources]}
