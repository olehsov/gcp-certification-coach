    order: 1
    title: "Organization policies"
    sections: ["1.1"]
    weight: core
    examRelevant: true
    concepts:
      - {id: g01-k1, order: 1, title: "Organization Policy Service", docUrls: ["https://docs.cloud.google.com/organization-policy/overview"]}
      - {id: g01-k2, order: 2, title: "Constraints and inheritance", docUrls: ["https://docs.cloud.google.com/organization-policy/hierarchy-evaluation", "https://docs.cloud.google.com/organization-policy/reference/org-policy-constraints"]}
