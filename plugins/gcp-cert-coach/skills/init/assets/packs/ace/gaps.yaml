# Exam-guide gaps: objectives of the Associate Cloud Engineer exam guide that the learning path
# does not cover or covers only in passing. Seeded as one extra activity (kind: gaps, id: gaps)
# shown only in Full exam mode. Each gap topic becomes a module; each concept links 1-3 official
# documentation pages (verified working on the pack's lastVerified date).

activity:
  id: gaps
  kind: gaps
  title: "Exam guide gaps"
  hoursPerTopic: 1
  optional: false

topics:
